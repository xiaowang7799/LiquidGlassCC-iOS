name: LiquidGlassCC CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-rootless:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git C:\Users\HP/theos
          echo "THEOS=C:\Users\HP/theos" >> 
          echo "SDKVERSION=16.5" >> 

      - name: Build Rootless deb
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless SDKVERSION=16.5
          ls -la packages