name: LiquidGlassCC CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-rootless:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Rootless deb
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          export THEOS="$HOME/theos"
          make package THEOS_PACKAGE_SCHEME=rootless SDKVERSION=16.5
          ls -la packages