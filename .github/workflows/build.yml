name: LiquidGlassCC CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-rootless:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Rootless deb
        run: |
          export THEOS="$HOME/theos"
          export THEOS="$HOME/theos"
          echo "SDKVERSION=16.5" >> "$GITHUB_ENV"
          export THEOS="$HOME/theos"
          ls -la packages